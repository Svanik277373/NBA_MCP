[project]
name = "nba-scout-agent"
version = "0.1.0"
description = "Agentic AI + MCP + RAG demo: an NBA scouting assistant"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2.0",
    "nba_api>=1.5.2",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "chromadb>=0.5.20",
    "voyageai>=0.3.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false
